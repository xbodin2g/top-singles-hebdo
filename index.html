<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Top Singles Hebdo — Données Officielles</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-solid: #ffffff;
      --overlay: rgba(255, 255, 255, 0.72);
      --chip-bg: rgba(255, 255, 255, 0.72);
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.09);
      --accent: #6366f1;
      --accent-2: #a855f7;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      --focus: rgba(99, 102, 241, 0.18);
      --success-bg: rgba(22, 163, 74, 0.12);
      --danger-bg: rgba(220, 38, 38, 0.12);
      --warning-bg: rgba(217, 119, 6, 0.14);
      --accent-bg: rgba(99, 102, 241, 0.14);
    }

    [data-theme="dark"] {
      --bg: #0b1020;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-solid: #0f172a;
      --overlay: rgba(15, 23, 42, 0.72);
      --chip-bg: rgba(15, 23, 42, 0.72);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #818cf8;
      --accent-2: #c084fc;
      --success: #4ade80;
      --danger: #fb7185;
      --warning: #fbbf24;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      --focus: rgba(129, 140, 248, 0.2);
      --success-bg: rgba(74, 222, 128, 0.14);
      --danger-bg: rgba(251, 113, 133, 0.14);
      --warning-bg: rgba(251, 191, 36, 0.14);
      --accent-bg: rgba(129, 140, 248, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.16), transparent 32%),
        var(--bg);
    }

    .app {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 26px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .topbar p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      border: 1px solid var(--border);
      background: var(--panel-solid);
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .button {
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 14px;
      cursor: pointer;
      font: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .loading {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .error {
      padding: 20px;
      margin: 20px 0;
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 16px;
      color: var(--danger);
    }

    .note {
      margin-top: 20px;
      padding: 15px 17px;
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      margin-top: 20px;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .control-group label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      border-radius: 16px;
      padding: 12px 14px;
      outline: none;
      font: inherit;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus);
    }

    select:disabled { opacity: 0.65; }

    .stats {
      margin-top: 20px;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .stat {
      padding: 16px;
      border-radius: 20px;
      background: var(--overlay);
      border: 1px solid var(--border);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
    }

    .chart-panel {
      margin-top: 20px;
      padding: 20px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding: 8px 8px 18px;
    }

    .chart-header h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .chart-header p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .table-head, .row {
      display: grid;
      grid-template-columns: 64px 110px 56px minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 13px 14px;
    }

    .table-head {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-bottom: 8px;
    }

    .row {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent),
        var(--overlay);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .row:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .rank {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      font-weight: 800;
      background: var(--panel-solid);
      border: 1px solid var(--border);
    }

    .rank.top {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
    }

    .movement {
      width: fit-content;
      padding: 9px 11px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    .movement.up { color: var(--success); background: var(--success-bg); }
    .movement.down { color: var(--danger); background: var(--danger-bg); }
    .movement.same { color: var(--muted); background: rgba(100, 116, 139, 0.12); }
    .movement.new { color: var(--warning); background: var(--warning-bg); }
    .movement.score { color: var(--accent); background: var(--accent-bg); }

    .cover {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }

    .meta { min-width: 0; }

    .title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .artist { color: var(--muted); }

    .details {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .chip {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: var(--chip-bg);
      white-space: nowrap;
    }

    .chip.success {
      color: var(--success);
      border-color: rgba(22, 163, 74, 0.25);
    }

    .chip.new {
      color: var(--warning);
      border-color: rgba(217, 119, 6, 0.25);
    }

    .flags {
      font-size: 18px;
      letter-spacing: 2px;
    }

    .empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .controls, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { flex-direction: column; }
      .topbar-actions { width: 100%; justify-content: flex-start; }
    }

    @media (max-width: 820px) {
      .table-head { display: none; }
      .row {
        grid-template-columns: auto auto 52px 1fr;
        grid-template-areas:
          "rank movement cover meta"
          "details details details details";
      }
      .rank { grid-area: rank; }
      .movement { grid-area: movement; }
      .cover { grid-area: cover; }
      .meta { grid-area: meta; }
      .details { grid-area: details; justify-content: flex-start; margin-top: 12px; }
    }

    @media (max-width: 640px) {
      .controls, .stats { grid-template-columns: 1fr; }
      .row {
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "rank movement"
          "cover meta"
          "details details";
      }
      .cover { width: 44px; height: 44px; border-radius: 14px; }
      .chart-header { flex-direction: column; }
      .legend { justify-content: flex-start; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar panel">
      <div>
        <h1>Top Singles Hebdo</h1>
        <p>
          Synthèse hebdomadaire des tops singles officiels — Europe, pays anglo-saxons, Amérique du Sud.
          Données collectées automatiquement.
        </p>
      </div>

      <div class="topbar-actions">
        <span class="badge" id="weekBadge">Chargement...</span>
        <button class="button" id="themeToggle" type="button">🌙 Sombre</button>
        <button class="button" id="refreshBtn" type="button">🔄 Actualiser</button>
      </div>
    </header>

    <div id="loadingIndicator" class="loading panel">
      Chargement des données officielles...
    </div>

    <div id="errorContainer" style="display: none;"></div>

    <div id="mainContent" style="display: none;">
      <div class="note panel" id="sourceNote"></div>

      <section class="panel controls">
        <div class="control-group">
          <label for="regionSelect">Région</label>
          <select id="regionSelect"></select>
        </div>

        <div class="control-group" id="countryGroup">
          <label for="countrySelect">Pays</label>
          <select id="countrySelect"></select>
        </div>

        <div class="control-group">
          <label for="viewMode">Vue</label>
          <select id="viewMode">
            <option value="synthesis" selected>Synthèse région</option>
            <option value="country">Détail pays</option>
          </select>
        </div>

        <div class="control-group">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="search" placeholder="Titre ou artiste" autocomplete="off" />
        </div>
      </section>

      <section class="panel stats" id="statsBar"></section>

      <section class="panel chart-panel">
        <div class="chart-header">
          <div>
            <h2 id="chartTitle"></h2>
            <p id="chartSubtitle"></p>
          </div>

          <div class="legend">
            <span class="chip success">▲ Progression</span>
            <span class="chip">▼ Baisse</span>
            <span class="chip new">✦ Entrée</span>
            <span class="chip">● Stable</span>
          </div>
        </div>

        <div id="chartContent"></div>
      </section>
    </div>
  </div>

  <script>
    let CHARTS_DATA = null;
    let COUNTRIES = {};
    let REGIONS = {};

    const regionSelect = document.getElementById("regionSelect");
    const countrySelect = document.getElementById("countrySelect");
    const viewMode = document.getElementById("viewMode");
    const searchInput = document.getElementById("searchInput");
    const chartTitle = document.getElementById("chartTitle");
    const chartSubtitle = document.getElementById("chartSubtitle");
    const chartContent = document.getElementById("chartContent");
    const statsBar = document.getElementById("statsBar");
    const weekBadge = document.getElementById("weekBadge");
    const sourceNote = document.getElementById("sourceNote");
    const themeToggle = document.getElementById("themeToggle");
    const countryGroup = document.getElementById("countryGroup");
    const loadingIndicator = document.getElementById("loadingIndicator");
    const errorContainer = document.getElementById("errorContainer");
    const mainContent = document.getElementById("mainContent");
    const refreshBtn = document.getElementById("refreshBtn");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initials(value) {
      return value
        .split(/\s+/)
        .slice(0, 2)
        .map((part) => part[0] || "")
        .join("")
        .toUpperCase();
    }

    function movementLabel(entry) {
      if (entry.movement === "new") return "✦ Nouveau";
      if (entry.movement === "up") return `▲ ${entry.previousPosition - entry.position}`;
      if (entry.movement === "down") return `▼ ${entry.position - entry.previousPosition}`;
      return "● Stable";
    }

    async function loadChartData() {
      try {
        loadingIndicator.style.display = "block";
        errorContainer.style.display = "none";
        mainContent.style.display = "none";

        // Essayer de charger les données
        const response = await fetch("data/charts-latest.json");
        
        if (!response.ok) {
          throw new Error("Fichier de données introuvable");
        }

        CHARTS_DATA = await response.json();

        // Construire COUNTRIES et REGIONS
        COUNTRIES = {};
        Object.entries(CHARTS_DATA.countries).forEach(([code, data]) => {
          COUNTRIES[code] = {
            name: data.name,
            flag: data.flag,
            code: code.toUpperCase(),
            region: data.region
          };
        });

        REGIONS = CHARTS_DATA.regions;

        // Mettre à jour l'interface
        weekBadge.textContent = CHARTS_DATA.meta.weekLabel;
        sourceNote.textContent = CHARTS_DATA.meta.sourceNote;

        populateRegions();
        populateCountries();
        updateCountrySelectState();
        render();

        loadingIndicator.style.display = "none";
        mainContent.style.display = "block";

      } catch (error) {
        loadingIndicator.style.display = "none";
        errorContainer.style.display = "block";
        errorContainer.innerHTML = `
          <div class="error">
            <strong>⚠️ Erreur de chargement</strong>
            <p>${error.message}</p>
            <p>Assurez-vous que le script Python a été exécuté et que le fichier <code>data/charts-latest.json</code> existe.</p>
            <p>Consultez le README pour les instructions d'installation.</p>
          </div>
        `;
      }
    }

    function populateRegions() {
      regionSelect.innerHTML = Object.entries(REGIONS)
        .map(([code, region]) => `<option value="${code}">${escapeHtml(region.label)}</option>`)
        .join("");

      regionSelect.value = "europe";
    }

    function populateCountries() {
      const region = regionSelect.value;
      const codes = REGIONS[region].countries;
      const current = countrySelect.value;

      countrySelect.innerHTML = codes
        .map((code) => {
          const country = COUNTRIES[code];
          return `<option value="${code}">${country.flag} ${escapeHtml(country.name)}</option>`;
        })
        .join("");

      countrySelect.value = codes.includes(current) ? current : codes[0];
    }

    function updateCountrySelectState() {
      const isCountryView = viewMode.value === "country";
      countrySelect.disabled = !isCountryView;
      countryGroup.style.opacity = isCountryView ? "1" : "0.55";
    }

    function matchesQuery(track, query) {
      if (!query) return true;
      return (
        track.title.toLowerCase().includes(query) ||
        track.artist.toLowerCase().includes(query)
      );
    }

    function getCountryEntries(countryCode, query = "") {
      const chart = CHARTS_DATA.countries[countryCode]?.chart || [];
      return chart
        .map((entry) => ({
          ...entry,
          country: countryCode
        }))
        .filter((entry) => matchesQuery(entry.track, query));
    }

    function getSynthesisEntries(regionCode, query = "") {
      const countryCodes = REGIONS[regionCode].countries;
      const aggregated = new Map();

      countryCodes.forEach((code) => {
        const chart = CHARTS_DATA.countries[code]?.chart || [];
        chart.forEach((entry) => {
          const trackKey = `${entry.track.title}-${entry.track.artist}`.toLowerCase();
          
          if (!aggregated.has(trackKey)) {
            aggregated.set(trackKey, {
              track: entry.track,
              score: 0,
              countryCodes: new Set(),
              bestPosition: 999,
              entries: []
            });
          }

          const item = aggregated.get(trackKey);
          item.score += Math.max(1, 101 - entry.position);
          item.countryCodes.add(code);
          item.bestPosition = Math.min(item.bestPosition, entry.position);
          item.entries.push({ ...entry, country: code });
        });
      });

      const sorted = Array.from(aggregated.values()).sort((a, b) => {
        return b.score - a.score || a.bestPosition - b.bestPosition;
      });

      const filtered = query
        ? sorted.filter((item) => matchesQuery(item.track, query))
        : sorted.slice(0, 20);

      return filtered.map((item, index) => ({
        ...item,
        position: index + 1,
        countriesCount: item.countryCodes.size,
        countryList: Array.from(item.countryCodes)
      }));
    }

    function renderStats(view, region) {
      if (view === "country") {
        const countryCode = countrySelect.value;
        const country = COUNTRIES[countryCode];
        const fullChart = CHARTS_DATA.countries[countryCode]?.chart || [];

        const upCount = fullChart.filter((e) => e.movement === "up").length;
        const newCount = fullChart.filter((e) => e.movement === "new").length;

        statsBar.innerHTML = `
          <div class="stat">
            <div class="stat-value">${country.flag}</div>
            <div class="stat-label">${escapeHtml(country.name)}</div>
          </div>
          <div class="stat">
            <div class="stat-value">${fullChart.length}</div>
            <div class="stat-label">Titres classés</div>
          </div>
          <div class="stat">
            <div class="stat-value">${upCount}</div>
            <div class="stat-label">Progressions</div>
          </div>
          <div class="stat">
            <div class="stat-value">${newCount}</div>
            <div class="stat-label">Entrées</div>
          </div>
        `;
        return;
      }

      const regionData = REGIONS[region];
      const countryCodes = regionData.countries;
      const uniqueTracks = new Set();
      let totalPositions = 0;

      countryCodes.forEach((code) => {
        const chart = CHARTS_DATA.countries[code]?.chart || [];
        chart.forEach((entry) => {
          uniqueTracks.add(`${entry.track.title}-${entry.track.artist}`);
          totalPositions += 1;
        });
      });

      statsBar.innerHTML = `
        <div class="stat">
          <div class="stat-value">${escapeHtml(regionData.label)}</div>
          <div class="stat-label">Région</div>
        </div>
        <div class="stat">
          <div class="stat-value">${countryCodes.length}</div>
          <div class="stat-label">Pays agrégés</div>
        </div>
        <div class="stat">
          <div class="stat-value">${uniqueTracks.size}</div>
          <div class="stat-label">Titres détectés</div>
        </div>
        <div class="stat">
          <div class="stat-value">${totalPositions}</div>
          <div class="stat-label">Positions collectées</div>
        </div>
      `;
    }

    function countryRow(entry) {
      return `
        <div class="row">
          <div class="rank ${entry.position <= 3 ? "top" : ""}">${entry.position}</div>
          <div class="movement ${entry.movement}">${movementLabel(entry)}</div>
          <div class="cover">${initials(entry.track.title)}</div>
          <div class="meta">
            <div class="title">${escapeHtml(entry.track.title)}</div>
            <div class="artist">${escapeHtml(entry.track.artist)}</div>
          </div>
          <div class="details">
            <span class="chip">${entry.weeksOnChart} semaine${entry.weeksOnChart > 1 ? "s" : ""}</span>
            <span class="chip">Pic ${entry.peakPosition}</span>
            ${entry.previousPosition 
              ? `<span class="chip">Préc. ${entry.previousPosition}</span>`
              : `<span class="chip new">Entrée</span>`}
          </div>
        </div>
      `;
    }

    function synthesisRow(entry) {
      return `
        <div class="row">
          <div class="rank ${entry.position <= 3 ? "top" : ""}">${entry.position}</div>
          <div class="movement score">Score ${entry.score}</div>
          <div class="cover">${initials(entry.track.title)}</div>
          <div class="meta">
            <div class="title">${escapeHtml(entry.track.title)}</div>
            <div class="artist">${escapeHtml(entry.track.artist)}</div>
          </div>
          <div class="details">
            <span class="chip success">${entry.countriesCount} pays</span>
            <span class="chip">Meilleure place ${entry.bestPosition}</span>
            <span class="flags">
              ${entry.countryList.map((code) => COUNTRIES[code]?.flag || code.toUpperCase()).join(" ")}
            </span>
          </div>
        </div>
      `;
    }

    function renderList(entries, view) {
      if (!entries.length) {
        chartContent.innerHTML = `<div class="empty">Aucun résultat avec ces filtres.</div>`;
        return;
      }

      const head = view === "country"
        ? `<div class="table-head">
            <div>Place</div>
            <div>Évolution</div>
            <div>Pochette</div>
            <div>Titre / artiste</div>
            <div style="text-align: right;">Détails</div>
          </div>`
        : `<div class="table-head">
            <div>Rang</div>
            <div>Score</div>
            <div>Pochette</div>
            <div>Titre / artiste</div>
            <div style="text-align: right;">Pays</div>
          </div>`;

      const rows = entries
        .map((entry) => (view === "country" ? countryRow(entry) : synthesisRow(entry)))
        .join("");

      chartContent.innerHTML = head + rows;
    }

    function render() {
      if (!CHARTS_DATA) return;

      const region = regionSelect.value;
      const view = viewMode.value;
      const query = searchInput.value.trim().toLowerCase();

      let entries = [];

      if (view === "country") {
        const countryCode = countrySelect.value;
        const country = COUNTRIES[countryCode];
        entries = getCountryEntries(countryCode, query);
        chartTitle.textContent = `${country.flag} ${country.name} — Top Singles`;
        chartSubtitle.textContent = `${CHARTS_DATA.meta.weekLabel} · Données officielles`;
      } else {
        entries = getSynthesisEntries(region, query);
        chartTitle.textContent = `${REGIONS[region].label} — Synthèse singles`;
        chartSubtitle.textContent = `${CHARTS_DATA.meta.weekLabel} · Agrégation des tops officiels`;
      }

      renderStats(view, region);
      renderList(entries, view);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️ Clair" : "🌙 Sombre";
      localStorage.setItem("musiccharts-theme", theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(current);
    }

    regionSelect.addEventListener("change", () => {
      populateCountries();
      render();
    });

    countrySelect.addEventListener("change", render);
    viewMode.addEventListener("change", () => {
      updateCountrySelectState();
      render();
    });

    searchInput.addEventListener("input", render);
    themeToggle.addEventListener("click", toggleTheme);
    refreshBtn.addEventListener("click", loadChartData);

    const savedTheme =
      localStorage.getItem("musiccharts-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

    applyTheme(savedTheme);

    // Charger les données au démarrage
    loadChartData();
  </script>
</body>
</html>
