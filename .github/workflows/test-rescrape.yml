name: Test Rescrape

on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Cles manuelles (vide = utiliser la liste de cibles)'
        required: false
        default: ''
      year:
        description: 'Filtrer sur une anne (vide = toutes)'
        required: false
        default: ''
      limit:
        description: 'Nombre max de semaines (0 = toutes)'
        required: false
        default: '20'
      mode:
        description: 'dry-run = aucune ecriture / apply = enregistrer'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: write

concurrency:
  group: test-rescrape
  cancel-in-progress: false

jobs:
  rescrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build arguments
        id: args
        run: |
          A=""
          if [ -n "${{ inputs.keys }}" ]; then
            A="--keys ${{ inputs.keys }}"
          else
            A="--list data/rescrape_targets.json"
          fi
          if [ -n "${{ inputs.year }}" ]; then
            A="$A --year ${{ inputs.year }}"
          fi
          A="$A --limit ${{ inputs.limit }}"
          if [ "${{ inputs.mode }}" = "apply" ]; then
            A="$A --apply"
          fi
          echo "flags=$A" >> "$GITHUB_OUTPUT"
          echo "Arguments : $A"

      - name: Run rescrape
        run: python test_rescrape.py ${{ steps.args.outputs.flags }}

      - name: Rebuild artist index
        if: ${{ inputs.mode == 'apply' }}
        run: python build_artist_index.py

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/rescrape_test_report.json
          if [ "${{ inputs.mode }}" = "apply" ]; then
            git add data/cache/retro_archives.json data/cache/artist_index.json
          fi

          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi

          git commit -m "Re-scraping cible (${{ inputs.mode }}) anne=${{ inputs.year }} limite=${{ inputs.limit }}"
          git pull --rebase origin main
          git push origin main