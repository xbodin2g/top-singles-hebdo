name: Find Rescrape Targets

on:
  workflow_dispatch:
    inputs:
      max_gaps:
        description: 'Nombre max de trous pour retenir une semaine'
        required: false
        default: '5'
      limit:
        description: 'Lignes affichees dans le rapport'
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: find-rescrape-targets
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detecter les paliers de la source
        run: |
          echo "############################################################"
          echo "# PALIERS DE TAILLE — CHARTSINFRANCE"
          echo "############################################################"
          python find_source_limits.py

      - name: Trouver les cibles de re-scraping
        run: |
          echo ""
          echo "############################################################"
          echo "# CIBLES DE RE-SCRAPING"
          echo "############################################################"
          python find_rescrape_targets.py --max-gaps "${{ inputs.max_gaps }}" --limit "${{ inputs.limit }}"

      - name: Commit target list
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -f data/rescrape_targets.json ]; then
            git add data/rescrape_targets.json
          fi

          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi

          git commit -m "Cibles de re-scraping + detection paliers source"
          git pull --rebase origin main
          git push origin main