name: Find Rescrape Targets

on:
  workflow_dispatch:
    inputs:
      max_gaps:
        description: 'Nombre max de trous pour retenir une semaine'
        required: false
        default: '5'
      limit:
        description: 'Lignes affichees'
        required: false
        default: '50'
      include_snep:
        description: 'Inclure SNEP (trous internes)'
        required: false
        default: 'non'
        type: choice
        options:
          - non
          - oui

permissions:
  contents: write

concurrency:
  group: find-rescrape-targets
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paliers de la source
        run: python find_source_limits.py

      - name: Cibles (sans SNEP)
        if: ${{ inputs.include_snep == 'non' }}
        run: |
          python find_rescrape_targets.py --max-gaps "${{ inputs.max_gaps }}" --limit "${{ inputs.limit }}"

      - name: Cibles (avec SNEP)
        if: ${{ inputs.include_snep == 'oui' }}
        run: |
          python find_rescrape_targets.py --max-gaps "${{ inputs.max_gaps }}" --limit "${{ inputs.limit }}" --include-snep

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f data/rescrape_targets.json ]; then
            git add data/rescrape_targets.json
          fi
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Cibles de re-scraping (snep=${{ inputs.include_snep }})"
          git pull --rebase origin main
          git push origin main