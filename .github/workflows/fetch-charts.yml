name: Fetch Music Charts

on:
  schedule:
    # Exécute tous les samedis à 10h UTC (midi heure de Paris)
    - cron: '0 10 * * 6'
  workflow_dispatch: # Permet de déclencher manuellement

permissions:
  contents: write

jobs:
  fetch-charts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Récupère tout l'historique
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Fetch charts
      run: python fetch_charts.py
      
     - name: Auto commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Update charts - ${{ github.run_id }}"
        branch: main
        file_pattern: 'data/*.json'
        commit_user_name: GitHub Action
        commit_user_email: action@github.com
        
        # Ajouter les fichiers modifiés
        git add data/
        
        # Vérifier s'il y a des changements
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        # Commit les changements
        git commit -m "📊 Update charts - $(date +%Y-%m-%d)"
        
        # Pull avec rebase pour intégrer les changements distants
        git pull --rebase origin main
        
        # Push les changements
        git push origin main