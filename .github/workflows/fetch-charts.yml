name: Fetch Weekly Charts

on:
  schedule:
    # Exécuter chaque vendredi à 14h UTC (après publication des charts)
    - cron: '0 14 * * 5'
  
  workflow_dispatch:
    inputs:
      debug:
        description: 'Mode debug (affiche plus de logs)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  fetch-charts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 yt-dlp
      
      - name: Fetch weekly charts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python fetch_charts.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add data/
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update weekly charts - $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main