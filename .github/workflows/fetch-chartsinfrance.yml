name: Fetch ChartsInFrance Archives

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Année (ex: 1989) ou "latest" pour la semaine en cours'
        required: true
        type: string
      weeks:
        description: 'Semaines (ex: 1-52 ou 23) - optionnel si year=latest'
        required: false
        type: string

  schedule:
    # Exécuter chaque vendredi à 18h (après publication des charts)
    - cron: '0 18 * * 5'

permissions:
  contents: write

jobs:
  fetch-archives:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
        
      - name: Fetch latest week (scheduled)
        if: github.event_name == 'schedule'
        run: |
          python fetch_chartsinfrance.py --latest
      
      - name: Fetch specific year (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.year != 'latest'
        run: |
          if [ -n "${{ github.event.inputs.weeks }}" ]; then
            python fetch_chartsinfrance.py --year ${{ github.event.inputs.year }} --weeks "${{ github.event.inputs.weeks }}"
          else
            python fetch_chartsinfrance.py --year ${{ github.event.inputs.year }}
          fi
      
      - name: Fetch latest week (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.year == 'latest'
        run: |
          python fetch_chartsinfrance.py --latest
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add data/
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update chartsinfrance data - $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main