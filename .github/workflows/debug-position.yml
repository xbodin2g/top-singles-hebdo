name: Debug Position

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Semaine (ex: 1995-24)'
        required: true
        default: '1995-24'
      position:
        description: 'Position manquante (ex: 41)'
        required: true
        default: '41'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Debug position
        run: python debug_position.py --key "${{ inputs.key }}" --position "${{ inputs.position }}"